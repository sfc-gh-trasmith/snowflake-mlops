name: Rollback PROD

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: 'Model version to roll back to (e.g., V4)'
        required: true
      reason:
        description: 'Reason for rollback'
        required: true

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: PROD
    env:
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE_PROD }}
      SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER_PROD }}
      SNOWFLAKE_ROLE: MLOPS_PROD_ROLE
    steps:
      - uses: actions/checkout@v4

      - name: Set up Snowflake CLI
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Test Snowflake Connection
        run: snow connection test -x

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group snow --group ml-runtime --no-default-groups

      - name: Read serving modes from config
        id: serving
        run: uv run python source/utils/serving_flags.py

      - name: Set model default version
        env:
          MODEL_VERSION: ${{ inputs.model_version }}
        run: uv run python deploy/set_default_version.py --version "$MODEL_VERSION"

      - name: Deploy SPCS service for rolled-back version
        if: steps.serving.outputs.realtime_enabled == 'true'
        env:
          MODEL_VERSION: ${{ inputs.model_version }}
        run: |
          uv run python scripts/deploy_prod_service.py
          # Rollback is immediate: route 100% to the rolled-back version
          uv run python scripts/apply_gateway_config.py --targets "${MODEL_VERSION}:100"
        timeout-minutes: 25

      - name: REST smoke test (gateway + services)
        if: steps.serving.outputs.realtime_enabled == 'true'
        run: uv run python scripts/smoke_test_endpoint.py
        timeout-minutes: 15

      # main is protected: record the live split through a PR instead of a push
      - name: Open PR syncing deploy/gateway-config.yml
        if: steps.serving.outputs.realtime_enabled == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/sync_gateway_config.sh "Rollback: gateway traffic to ${{ inputs.model_version }}"
      - name: Validate batch inference (rolled-back version)
        if: steps.serving.outputs.batch_enabled == 'true'
        run: uv run python source/pipeline/batch_inference_dag.py --validate --env prod
        timeout-minutes: 10

      - name: Tag rollback
        env:
          MODEL_VERSION: ${{ inputs.model_version }}
          ROLLBACK_REASON: ${{ inputs.reason }}
        run: |
          TAG="prod/${MODEL_VERSION}-rollback-$(date +%Y%m%d-%H%M%S)"
          git tag "$TAG" -m "ROLLBACK to ${MODEL_VERSION}: ${ROLLBACK_REASON}"
          git push origin "$TAG"
          echo "Tagged: $TAG"

      - name: Summary
        env:
          MODEL_VERSION: ${{ inputs.model_version }}
          ROLLBACK_REASON: ${{ inputs.reason }}
        run: |
          echo "## Rollback Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Rolled back to | \`${MODEL_VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${ROLLBACK_REASON} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
