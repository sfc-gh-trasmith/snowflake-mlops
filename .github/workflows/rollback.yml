name: Rollback PROD

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: 'Model version to roll back to (e.g., V4)'
        required: true
      reason:
        description: 'Reason for rollback'
        required: true

permissions:
  id-token: write
  contents: write

env:
  SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: PROD
    env:
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE_PROD }}
      SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER_PROD }}
      SNOWFLAKE_ROLE: MLOPS_DEPLOY_ROLE
    steps:
      - uses: actions/checkout@v4

      - name: Set up Snowflake CLI
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Test Snowflake Connection
        run: snow connection test -x

      - name: Verify target version exists
        run: |
          snow sql -q "SHOW VERSIONS IN MODEL SNOW_MLOPS_PROD.ML.MLOPS_FRAUD_DETECTOR" -x
          echo "Rolling back to version: ${{ inputs.model_version }}"

      - name: Set model default version
        run: |
          snow sql -q "ALTER MODEL SNOW_MLOPS_PROD.ML.MLOPS_FRAUD_DETECTOR SET DEFAULT_VERSION = ${{ inputs.model_version }}" -x
          echo "Model default version set to ${{ inputs.model_version }}"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group snow --no-default-groups

      - name: Deploy SPCS service for rolled-back version
        run: uv run python scripts/deploy_prod_service.py
        timeout-minutes: 20

      - name: Run batch inference (validate rollback)
        run: uv run python scripts/run_batch_inference.py
        timeout-minutes: 10

      - name: Tag rollback
        run: |
          TAG="prod/${{ inputs.model_version }}-rollback-$(date +%Y%m%d-%H%M%S)"
          git tag "$TAG" -m "ROLLBACK to ${{ inputs.model_version }}: ${{ inputs.reason }}"
          git push origin "$TAG"
          echo "Tagged: $TAG"

      - name: Summary
        run: |
          echo "## Rollback Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Rolled back to | \`${{ inputs.model_version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ inputs.reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
