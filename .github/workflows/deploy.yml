name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual retrain (e.g., fresh data, threshold change)'
        required: false

permissions:
  id-token: write
  contents: write

env:
  SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # LINT: Code quality checks (runs in parallel with tests)
  # ──────────────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check source/ scripts/

      - name: Format check (ruff)
        run: uv run ruff format --check source/ scripts/

  # ──────────────────────────────────────────────────────────────────────
  # TEST: Unit tests (runs in parallel with lint)
  # ──────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest tests/ -v --ignore=tests/test_endpoint.py

  # ──────────────────────────────────────────────────────────────────────
  # STAGE: Train, validate, replicate model to PROD registry
  # ──────────────────────────────────────────────────────────────────────
  deploy-stage:
    needs: [lint, test]
    runs-on: ubuntu-latest
    environment: STAGE
    env:
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE_STAGE }}
      SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER_STAGE }}
      SNOWFLAKE_ROLE: MLOPS_DEPLOY_ROLE
      TOPOLOGY: ${{ vars.TOPOLOGY || 'single-account' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Snowflake CLI
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Test Snowflake Connection
        run: snow connection test -x

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group snow --no-default-groups

      - name: Upload pipeline source to stage
        run: |
          snow stage copy source/ @${{ vars.SNOWFLAKE_DATABASE_STAGE }}.${{ vars.SNOWFLAKE_SCHEMA }}.PIPELINE_STAGE/source/ --overwrite -x

      - name: Deploy Task DAG
        run: uv run python source/pipeline/ml_pipeline_dag.py --deploy --env stage

      - name: Trigger ML training pipeline
        run: uv run python source/pipeline/ml_pipeline_dag.py --run --env stage

      - name: Wait for training pipeline completion
        run: uv run python scripts/wait_for_task.py
        timeout-minutes: 30
        env:
          METRICS_FILE: ${{ runner.temp }}/pipeline_metrics.json

      - name: "Quality gate: evaluate metrics"
        run: uv run python scripts/quality_gate_and_register.py
        timeout-minutes: 10
        env:
          METRICS_FILE: ${{ runner.temp }}/pipeline_metrics.json

      - name: Run batch inference (validate)
        run: uv run python scripts/run_batch_inference.py
        timeout-minutes: 10

  # ──────────────────────────────────────────────────────────────────────
  # PROD: Model deployment (requires approval)
  # Gated by: (1) STAGE must pass, (2) PROD environment required reviewers
  # ──────────────────────────────────────────────────────────────────────
  deploy-prod:
    needs: deploy-stage
    runs-on: ubuntu-latest
    environment: PROD
    env:
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE_PROD }}
      SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER_PROD }}
      SNOWFLAKE_ROLE: MLOPS_DEPLOY_ROLE
      TOPOLOGY: ${{ vars.TOPOLOGY || 'single-account' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Snowflake CLI
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Test Snowflake Connection
        run: snow connection test -x

      - name: Verify model exists in PROD
        run: |
          snow sql -q "SHOW MODELS LIKE 'MLOPS_FRAUD_DETECTOR' IN SNOW_MLOPS_PROD.ML" -x

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group snow --no-default-groups

      - name: Register Feature Views in PROD
        run: uv run python -c "import sys; sys.path.insert(0, 'source'); from features.feature_views import register_feature_views; from snowpark_session import create_snowpark_session; session = create_snowpark_session(); register_feature_views(session=session, database='SNOW_MLOPS_PROD', schema='ML', warehouse='SNOW_MLOPS_PROD_WH'); session.close()"
        timeout-minutes: 5

      - name: "Deploy batch inference (validate model.run())"
        run: uv run python scripts/run_batch_inference.py
        timeout-minutes: 10

      - name: "Deploy real-time service (SPCS blue/green)"
        run: uv run python scripts/deploy_prod_service.py
        timeout-minutes: 20

      - name: Verify gateway endpoint
        run: |
          snow sql -q "DESC GATEWAY SNOW_MLOPS_PROD.ML.FRAUD_DETECTOR_GATEWAY" -x

      - name: Tag production release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MODEL_VERSION=$(snow sql -q "SHOW MODELS LIKE 'MLOPS_FRAUD_DETECTOR' IN SNOW_MLOPS_PROD.ML" --format json -x | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['default_version_name'])" 2>/dev/null || echo "unknown")
          TAG="prod/${MODEL_VERSION}-$(date +%Y%m%d-%H%M%S)"
          gh api repos/${{ github.repository }}/git/refs -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}"
          echo "Tagged release: $TAG"
