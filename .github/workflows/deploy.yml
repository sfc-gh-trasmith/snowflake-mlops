name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      promote_only:
        description: 'Skip training, promote existing STAGE candidate to PROD'
        type: boolean
        default: false
      model_version:
        description: 'Specific model version to promote (required when promote_only=true, e.g. V3)'
        type: string
        required: false
      reason:
        description: 'Reason for manual trigger (e.g., promote candidate, fresh data retrain)'
        required: false

permissions:
  id-token: write
  contents: read
  issues: read

concurrency:
  group: ml-pipeline
  cancel-in-progress: false

env:
  SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # CODE QUALITY: Lint + unit tests
  # ──────────────────────────────────────────────────────────────────────
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group ml-runtime  # metrics tests need scikit-learn

      - name: Lint (ruff)
        run: uv run ruff check source/ scripts/ deploy/ tests/

      - name: Format check (ruff)
        run: uv run ruff format --check source/ scripts/ deploy/ tests/

      - name: Run unit tests
        run: uv run pytest tests/ -v --ignore=tests/test_endpoint.py

  # ──────────────────────────────────────────────────────────────────────
  # STAGE: Train, validate, replicate model to PROD registry
  # Skipped when promote_only=true (candidate already in STAGE)
  # ──────────────────────────────────────────────────────────────────────
  deploy-stage:
    needs: [code-quality]
    if: ${{ github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.promote_only) }}
    runs-on: ubuntu-latest
    environment: STAGE
    outputs:
      model_version: ${{ steps.quality_gate.outputs.model_version }}
    env:
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE_STAGE }}
      SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER_STAGE }}
      SNOWFLAKE_ROLE: MLOPS_STAGE_ROLE
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Snowflake CLI
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Test Snowflake Connection
        run: snow connection test -x

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group snow --group ml-runtime --no-default-groups

      - name: Deploy Task DAG (creates stage + results table + tasks)
        run: uv run python source/pipeline/train_dag.py --deploy --env stage

      - name: Trigger ML training pipeline
        run: uv run python source/pipeline/train_dag.py --execute --env stage

      - name: Wait for training pipeline completion
        run: uv run python source/utils/wait_for_task.py
        timeout-minutes: 30
        env:
          METRICS_FILE: ${{ runner.temp }}/pipeline_metrics.json

      - name: "Quality gate: read candidate (gate ran in EVALUATE)"
        id: quality_gate
        # Run even if the DAG failed, so the summary reports the rejection or failing step
        if: ${{ !cancelled() }}
        run: uv run python source/utils/read_candidate.py
        timeout-minutes: 10
        env:
          METRICS_FILE: ${{ runner.temp }}/pipeline_metrics.json

      - name: Read serving modes from config
        id: serving
        run: uv run python source/utils/serving_flags.py

      - name: Validate batch inference (candidate)
        if: steps.serving.outputs.batch_enabled == 'true'
        run: uv run python source/pipeline/batch_inference_dag.py --validate --env stage
        timeout-minutes: 10
        env:
          # Validate the candidate that just passed the gate, not the prior default
          MODEL_VERSION: ${{ steps.quality_gate.outputs.model_version }}

      - name: "Validate model monitor (create, verify, drop)"
        if: vars.ENABLE_MODEL_MONITOR == 'true' && steps.serving.outputs.monitor_enabled == 'true'
        run: uv run python source/utils/setup_model_monitor.py --env stage --validate-only
        timeout-minutes: 5
        env:
          MODEL_VERSION: ${{ steps.quality_gate.outputs.model_version }}

      # Keeps the newest N model/Dataset versions (retention.* in config.yml);
      # never the candidate, the default, or anything PROD lineage points at.
      - name: Retention (STAGE model and dataset versions)
        continue-on-error: true
        run: uv run python source/utils/retention.py --env stage
        timeout-minutes: 5

  # ──────────────────────────────────────────────────────────────────────
  # PROD: Model deployment (requires approval)
  # Gated by: PROD environment requires reviewer approval
  # When promote_only=true, deploy-stage is skipped so we use always() to allow running
  # ──────────────────────────────────────────────────────────────────────
  deploy-prod:
    needs: deploy-stage
    if: ${{ always() && (needs.deploy-stage.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.promote_only)) }}
    runs-on: ubuntu-latest
    environment: PROD
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
    env:
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE_PROD }}
      SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER_PROD }}
      SNOWFLAKE_ROLE: MLOPS_PROD_ROLE
    steps:
      - uses: actions/checkout@v4

      - name: Set up Snowflake CLI
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Test Snowflake Connection
        run: snow connection test -x

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group snow --group ml-runtime --no-default-groups

      # Recorded before anything changes, for the automatic rollback below.
      - name: Capture current PROD state
        id: before
        run: uv run python scripts/prod_state.py --capture

      - name: "Promote model to PROD (replicate from STAGE)"
        id: promote
        run: |
          if [ -z "$BLESSED_VERSION" ]; then
            echo "::error::No model version provided. Either deploy-stage must pass the quality gate, or specify model_version input for promote_only."
            exit 1
          fi
          uv run python deploy/promote.py --version "$BLESSED_VERSION"
        env:
          BLESSED_VERSION: ${{ needs.deploy-stage.outputs.model_version || inputs.model_version }}
        timeout-minutes: 5

      - name: Read serving modes from config
        id: serving
        run: uv run python source/utils/serving_flags.py

      # Registers PROD Feature Views (idempotent) and validates model.run()
      # with the promoted version before anything is scheduled or served.
      - name: "Validate batch inference (promoted version)"
        if: steps.serving.outputs.batch_enabled == 'true'
        run: uv run python source/pipeline/batch_inference_dag.py --validate --env prod
        timeout-minutes: 10

      - name: "Deploy scheduled batch scoring task"
        if: steps.serving.outputs.batch_enabled == 'true'
        run: uv run python source/pipeline/batch_inference_dag.py --deploy --env prod
        timeout-minutes: 10

      - name: "Deploy real-time service (SPCS canary)"
        if: steps.serving.outputs.realtime_enabled == 'true'
        run: uv run python scripts/deploy_prod_service.py
        timeout-minutes: 20

      - name: "Apply gateway traffic split"
        if: steps.serving.outputs.realtime_enabled == 'true'
        run: uv run python scripts/apply_gateway_config.py
        timeout-minutes: 5

      # Real HTTPS calls through the gateway and to each service behind it,
      # authenticated with a temporary PAT. A failure here rolls PROD back.
      - name: "REST smoke test (gateway + services)"
        if: steps.serving.outputs.realtime_enabled == 'true'
        run: uv run python scripts/smoke_test_endpoint.py
        timeout-minutes: 15

      # main is protected: record the live split through a PR instead of a push
      - name: Open PR syncing deploy/gateway-config.yml
        if: steps.serving.outputs.realtime_enabled == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/sync_gateway_config.sh "Gateway split after deploy-prod run ${{ github.run_id }}"
      - name: Set up model monitor
        if: vars.ENABLE_MODEL_MONITOR == 'true' && steps.serving.outputs.monitor_enabled == 'true'
        run: uv run python source/utils/setup_model_monitor.py --env prod
        timeout-minutes: 5

      - name: Retention (PROD model versions)
        continue-on-error: true
        run: uv run python source/utils/retention.py --env prod
        timeout-minutes: 5

      - name: Tag production release
        # A tagging problem shouldn't roll back a healthy deployment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BLESSED_VERSION: ${{ needs.deploy-stage.outputs.model_version || inputs.model_version }}
        run: |
          MODEL_VERSION="${BLESSED_VERSION:-unknown}"
          TAG="prod/${MODEL_VERSION}-$(date +%Y%m%d-%H%M%S)"
          gh api repos/${{ github.repository }}/git/refs -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}"
          echo "Tagged release: $TAG"

      # Any failure after promotion moved the default version (service deploy,
      # health check, gateway, smoke test, monitor) restores the previous
      # default version and gateway split. Dropping the failed canary service
      # happens as part of re-applying the previous split.
      - name: Automatic rollback
        if: failure() && steps.promote.outcome == 'success'
        env:
          PREV_VERSION: ${{ steps.before.outputs.default_version }}
          PREV_TARGETS: ${{ steps.before.outputs.gateway_targets }}
        run: uv run python scripts/prod_state.py --restore --version "$PREV_VERSION" --targets "$PREV_TARGETS"
        timeout-minutes: 10
