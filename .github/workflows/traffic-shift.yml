name: Traffic Shift

on:
  push:
    branches: [main]
    paths: ['deploy/gateway-config.yml']
  workflow_dispatch:
    inputs:
      targets:
        description: 'Traffic targets as "VERSION:WEIGHT" pairs (e.g., "V6:80,V7:20" or "V7:100")'
        required: true
        type: string
      reason:
        description: 'Reason for traffic shift (e.g., "complete V7 canary cutover")'
        required: false
        type: string

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency:
  group: gateway-traffic
  cancel-in-progress: false

env:
  SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}

jobs:
  shift-traffic:
    runs-on: ubuntu-latest
    environment: PROD
    env:
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE_PROD }}
      SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER_PROD }}
      SNOWFLAKE_ROLE: MLOPS_PROD_ROLE
    steps:
      - uses: actions/checkout@v4

      - name: Set up Snowflake CLI
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group snow --no-default-groups

      - name: Update deploy/gateway-config.yml from inputs
        if: inputs.targets != ''
        env:
          TARGETS: ${{ inputs.targets }}
        run: uv run python scripts/apply_gateway_config.py --targets "$TARGETS"
        timeout-minutes: 5

      - name: Apply deploy/gateway-config.yml (push-triggered)
        if: inputs.targets == ''
        run: uv run python scripts/apply_gateway_config.py
        timeout-minutes: 5

      - name: REST smoke test (gateway + services)
        run: uv run python scripts/smoke_test_endpoint.py
        timeout-minutes: 15

      # main is protected: record the live split through a PR instead of a push
      - name: Open PR syncing deploy/gateway-config.yml
        if: inputs.targets != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/sync_gateway_config.sh "Traffic shift: ${{ inputs.targets }}"
