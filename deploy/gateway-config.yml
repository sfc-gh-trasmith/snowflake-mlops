# Gateway traffic configuration — single source of truth for real-time traffic.
# Edit weights and merge to main to shift traffic; the traffic-shift workflow
# applies ALTER GATEWAY. Services removed from this file are dropped.
# Weights must sum to 100.
#
# Gateway name, initial canary weight, and instance sizing live in
# source/configs/config.yml under serving.realtime.
#
# Empty until the first PROD deployment; deploy-prod writes the initial target.

targets:
  - service: MLOPS_FRAUD_DETECTOR_SERVICE_V8
    weight: 100
