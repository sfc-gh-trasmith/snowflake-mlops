[project]
name = "snowflake-mlops"
version = "0.1.0"
description = "End-to-end MLOps pipeline on Snowflake: Feature Store, ML Jobs, Model Registry, SPCS Inference"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "llvmlite>=0.48.0",
    "snowflake-ml-python>=1.47.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "pytest>=8.0",
]
snow = [
    "snowflake-snowpark-python>=1.53.1",
    "snowflake-ml-python>=1.47.0",
    "snowflake>=1.0.0",
]
ml-runtime = [
    # Pinned to the versions preinstalled in the Snowflake ML Job runtime image,
    # so SPCS training needs no network access (no PyPI external access
    # integration). The same pins feed warehouse training and Model Registry
    # serving, keeping train/serve versions identical. When the runtime image
    # updates, bump these to match.
    "xgboost==3.3.0",
    "scikit-learn==1.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
