[project]
name = "snowflake-mlops"
version = "0.1.0"
description = "End-to-end MLOps pipeline on Snowflake: Feature Store, ML Jobs, Model Registry, SPCS Inference"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "snowflake-ml-python==2.4.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "pytest>=8.0",
]
snow = [
    "snowflake-snowpark-python>=1.53.1",
    "snowflake-ml-python==2.4.0",
    "snowflake>=1.0.0",
]
ml-runtime = [
    # Single source of truth for library versions on every compute path:
    #   - CI / local client (this lockfile)
    #   - ML Jobs on SPCS: installed from PyPI via the external access
    #     integration in config.yml (compute.pypi_access_integration)
    #   - warehouse stored procedures: Snowflake Anaconda channel
    #   - Model Registry serving: log_model(conda_dependencies=)
    # Each pipeline step verifies the installed versions match these pins
    # before running. Bump in one place; versions must exist on both PyPI and
    # the Anaconda channel (SELECT * FROM INFORMATION_SCHEMA.PACKAGES).
    "snowflake-ml-python==2.4.0",
    "xgboost==3.3.0",
    "scikit-learn==1.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
